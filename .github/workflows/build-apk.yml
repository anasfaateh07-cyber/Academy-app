name: Build Al Hadid APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Make gradlew executable
        run: chmod +x Academy-app/gradlew
      - name: Build APK
        run: cd Academy-app &&./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Hadid-Nasirabad-APK
          path: Academy-app/app/build/outputs/apk/debug/app-debug.apk
