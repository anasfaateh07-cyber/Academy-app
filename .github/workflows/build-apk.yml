name: Build APK and AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: echo '{"project_info":{"project_id":"dummy"}}' > app/google-services.json
      - run: ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with: { name: APK, path: app/build/outputs/apk/debug/app-debug.apk }
      - uses: actions/upload-artifact@v4
        with: { name: AAB-PlayStore, path: app/build/outputs/bundle/release/app-release.aab }
